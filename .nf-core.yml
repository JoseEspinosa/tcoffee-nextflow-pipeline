repository_type: pipeline

nf_core_version: 4.0.3

lint:
  files_unchanged:
    - .prettierignore
    - assets/sendmail_template.txt
    - CODE_OF_CONDUCT.md
    - assets/nf-core-tcoffee_logo_light.png
    - docs/images/nf-core-tcoffee_logo_light.png
    - docs/images/nf-core-tcoffee_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .prettierignore
    - docs/CONTRIBUTING.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config: false
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/multiqc_config.yml
    - CODE_OF_CONDUCT.md
    - assets/nf-core-tcoffee_logo_light.png
    - docs/images/nf-core-tcoffee_logo_light.png
    - docs/images/nf-core-tcoffee_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
  readme:
    - nextflow_badge
    - nfcore_template_badge

template:
  org: crg
  name: tcoffee
  description: Nextflow pipeline to run T-Coffee server commands
  author: Jose Espinosa-Carrasco
  version: 1.0.0dev
  force: true
  outdir: /Users/jaespinosa/git/cbcrg/tcoffee-nextflow-pipeline
  skip_features:
    - github_badges
    - fastqc
    - igenomes
    - multiqc
    - codespaces
    - vscode
    - rocrate
    - email
  is_nfcore: false
